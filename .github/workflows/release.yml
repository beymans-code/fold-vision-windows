name: Build and Release

on:
  push:
    tags:
      - '[0-9]*-*' # Se ejecutará con tags como 1-1.0.0, 2-1.0.1, etc.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish (For Installer)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false -o .\publish\FoldVision

    - name: Build Portable Version
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\publish\Portable
        mv .\publish\Portable\FoldVision.exe .\publish\FoldVision_Portable.exe

    - name: Compile Inno Setup Installer
      run: iscc installer.iss

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Output/FoldVision_Setup.exe
          publish/FoldVision_Portable.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
